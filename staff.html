<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dispatch · Mombasafish</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#032A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#032A2E; --deep:#07474C; --foam:#7FD4C1; --catch:#FFB84D;
  --coral:#FF6B5A; --sand:#F2EDE3; --dim:rgba(242,237,227,.60);
  --faint:rgba(242,237,227,.20);
  --display:'Archivo Black',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--abyss);color:var(--sand);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Shoreline behind everything. The photo is pale, so the scrim runs heavy —
   it reads as texture, never competes with the text. */
.bg{
  position:fixed;inset:0;z-index:-2;
  background-image:url('shore.jpg');
  background-image:-webkit-image-set(url('shore.webp') 1x);
  background-size:cover;
  background-position:center;
}
.bg::after{
  content:'';position:fixed;inset:0;
  background:linear-gradient(160deg,
    rgba(3,42,46,.87) 0%,
    rgba(3,42,46,.93) 45%,
    rgba(5,52,56,.96) 100%);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}

header{padding:26px 0 18px;border-bottom:1px solid var(--faint);margin-bottom:22px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:-.01em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--foam)}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.who span{font-size:13px;color:var(--dim)}
.link{background:none;border:none;color:var(--foam);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px}
.link:hover{text-decoration:underline}

/* login */
.card{background:rgba(3,42,46,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--faint);border-radius:5px;padding:22px;box-shadow:0 16px 44px rgba(0,0,0,.3)}
h1{font-family:var(--display);font-size:19px;margin-bottom:6px}
.lead{color:var(--dim);font-size:14px;margin-bottom:20px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input{width:100%;padding:14px;background:rgba(3,42,46,.78);border:1px solid var(--faint);border-radius:3px;color:var(--sand);font-family:var(--body);font-size:16px;margin-bottom:14px}
input:focus{outline:none;border-color:var(--foam)}
.btn{width:100%;padding:15px;background:var(--foam);color:var(--abyss);border:none;border-radius:3px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#96e0d0}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:11px 6px;background:transparent;border:1px solid var(--faint);border-radius:3px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{border-color:var(--foam);color:var(--foam);background:rgba(127,212,193,.09)}

/* order rows */
.order{border:1px solid var(--faint);border-radius:5px;padding:15px;margin-bottom:11px;background:rgba(3,42,46,.70);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.ono{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--sand)}
.cust{font-size:14px;color:var(--sand);margin-top:2px}
.dest{font-size:13px;color:var(--dim);margin-top:2px}
.items{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.6;padding-top:8px;border-top:1px solid rgba(242,237,227,.10)}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:100px;white-space:nowrap}
.p1{background:rgba(242,237,227,.15);color:var(--sand)}
.p2{background:rgba(127,212,193,.22);color:var(--foam)}
.p3{background:var(--catch);color:var(--abyss)}
.p4{background:var(--foam);color:var(--abyss)}
.pX{background:var(--coral);color:#fff}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{flex:1;min-width:120px;padding:11px;border:1px solid var(--faint);background:transparent;border-radius:3px;color:var(--sand);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.act:hover{border-color:var(--foam);color:var(--foam)}
.act.go{background:var(--catch);border-color:var(--catch);color:var(--abyss);font-weight:600}
.act.go:hover{background:#ffc76d;color:var(--abyss)}
.act:disabled{opacity:.45;cursor:not-allowed}

.msg{padding:13px 15px;border-radius:3px;font-size:14px;margin-bottom:16px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(255,107,90,.12);border:1px solid var(--coral);border-left-width:3px}
.msg.ok{background:rgba(127,212,193,.12);border:1px solid var(--foam);border-left-width:3px;color:var(--foam)}
.empty{text-align:center;padding:46px 20px;color:var(--dim);font-size:14px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bg" role="presentation"></div>
<div class="wrap">

  <header>
    <div class="brand">Mombasafish <em>Dispatch</em></div>
    <div class="sub">Staff only</div>
    <div class="who hidden" id="who">
      <span id="whoName"></span>
      <button class="link" id="out">Sign out</button>
    </div>
  </header>

  <div class="msg" id="msg"></div>

  <!-- LOGIN -->
  <section id="loginView">
    <div class="card">
      <h1>Sign in</h1>
      <p class="lead">Use the email and password you were given.</p>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" inputmode="email">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="in">Sign in</button>
    </div>
  </section>

  <!-- ORDERS -->
  <section id="appView" class="hidden">
    <div class="tabs">
      <button class="tab on" data-f="todo">To dispatch</button>
      <button class="tab" data-f="road">On the road</button>
      <button class="tab" data-f="done">Arrived</button>
    </div>
    <div id="list"></div>
  </section>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://tcpqbrchpxpshmqprbkv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7YLqP3JMq8AFZQl4XF--bw_itOMj1gA';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const STAGE = {1:['Confirmed','p1'],2:['Packed','p2'],3:['On the road','p3'],4:['Arrived','p4'],'-1':['Cancelled','pX']};
let orders = [], filter = 'todo';

function note(text, kind='ok'){
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg on ' + kind;
  clearTimeout(note._t);
  note._t = setTimeout(()=>m.className='msg', 4000);
}

async function signIn(){
  const btn = $('in'); btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ note(error.message, 'err'); return; }
  boot();
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); $('who').classList.add('hidden'); return; }

  const { data:staff } = await sb.from('mfm_staff').select('full_name, role').eq('user_id', session.user.id).maybeSingle();
  if(!staff){
    note('This account is not registered as staff. Ask Hemed to add you.', 'err');
    await sb.auth.signOut();
    return;
  }

  $('whoName').textContent = (staff.full_name || session.user.email) + ' · ' + staff.role;
  $('who').classList.remove('hidden');
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  await load();
}

async function load(){
  const { data, error } = await sb.from('mfm_orders')
    .select('order_number, customer_name, destination, items, stage, dispatched_at, courier')
    .order('date_ordered', { ascending:true });
  if(error){ note(error.message,'err'); return; }
  orders = data || [];
  render();
}

function render(){
  const sets = { todo:o=>o.stage===1||o.stage===2, road:o=>o.stage===3, done:o=>o.stage===4||o.stage===-1 };
  const rows = orders.filter(sets[filter]);
  if(!rows.length){ $('list').innerHTML = '<div class="empty">Nothing here right now.</div>'; return; }

  $('list').innerHTML = rows.map(o=>{
    const [label, cls] = STAGE[o.stage] || ['—','p1'];
    let acts = '';
    if(o.stage===1) acts = `<button class="act" data-s="2" data-o="${o.order_number}">Mark packed</button>
                            <button class="act go" data-s="3" data-o="${o.order_number}">Dispatch →</button>`;
    else if(o.stage===2) acts = `<button class="act go" data-s="3" data-o="${o.order_number}">Dispatch →</button>`;
    else if(o.stage===3) acts = `<button class="act" data-s="4" data-o="${o.order_number}">Mark arrived</button>`;
    return `<div class="order">
      <div class="order-top">
        <div>
          <div class="ono">${o.order_number}</div>
          <div class="cust">${o.customer_name || 'Customer'}</div>
          <div class="dest">${o.destination || ''}</div>
        </div>
        <span class="pill ${cls}">${label}</span>
      </div>
      ${o.items ? `<div class="items">${o.items}</div>` : ''}
      ${acts ? `<div class="acts">${acts}</div>` : ''}
    </div>`;
  }).join('');
}

async function setStage(orderNo, stage, btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
  const { error } = await sb.rpc('set_stage', { p_order: orderNo, p_stage: stage });
  if(error){ note(error.message,'err'); btn.disabled=false; btn.textContent=old; return; }
  note(`${orderNo} → ${STAGE[stage][0]}. The customer's tracking link is now live.`);
  await load();
}

$('in').addEventListener('click', signIn);
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
$('out').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); filter = t.dataset.f; render();
}));

$('list').addEventListener('click', e=>{
  const b = e.target.closest('.act');
  if(b) setStage(b.dataset.o, Number(b.dataset.s), b);
});

boot();
</script>
</body>
</html>
