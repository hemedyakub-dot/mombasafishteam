<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dispatch · Mombasafish</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#032A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#032A2E; --deep:#07474C; --foam:#7FD4C1; --catch:#FFB84D;
  --coral:#FF6B5A; --sand:#F2EDE3; --dim:rgba(242,237,227,.60);
  --faint:rgba(242,237,227,.20);
  --display:'Archivo Black',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--abyss);color:var(--sand);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Sunset shore behind everything. The source photo is heavily saturated, so it's
   desaturated and darkened before shipping — the scrim alone would go muddy. */
.bg{
  position:fixed;inset:0;z-index:-2;
  background-image:url('dispatch.jpg');
  background-image:-webkit-image-set(url('dispatch.webp') 1x);
  background-size:cover;
  background-position:center;
}
.bg::after{
  content:'';position:fixed;inset:0;
  background:linear-gradient(165deg,
    rgba(3,42,46,.82) 0%,
    rgba(3,42,46,.88) 45%,
    rgba(4,48,52,.93) 100%);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}

header{padding:26px 0 18px;border-bottom:1px solid var(--faint);margin-bottom:22px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:-.01em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--foam)}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.who span{font-size:13px;color:var(--dim)}
.link{background:none;border:none;color:var(--foam);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px}
.link:hover{text-decoration:underline}

/* login */
.card{background:rgba(3,42,46,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--faint);border-radius:5px;padding:22px;box-shadow:0 16px 44px rgba(0,0,0,.3)}
h1{font-family:var(--display);font-size:19px;margin-bottom:6px}
.lead{color:var(--dim);font-size:14px;margin-bottom:20px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input{width:100%;padding:14px;background:rgba(3,42,46,.78);border:1px solid var(--faint);border-radius:3px;color:var(--sand);font-family:var(--body);font-size:16px;margin-bottom:14px}
input:focus{outline:none;border-color:var(--foam)}
.btn{width:100%;padding:15px;background:var(--foam);color:var(--abyss);border:none;border-radius:3px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#96e0d0}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:11px 6px;background:transparent;border:1px solid var(--faint);border-radius:3px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{border-color:var(--foam);color:var(--foam);background:rgba(127,212,193,.09)}

/* order rows */
.order{border:1px solid var(--faint);border-radius:5px;padding:15px;margin-bottom:11px;background:rgba(3,42,46,.70);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.ono{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--sand)}
.cust{font-size:14px;color:var(--sand);margin-top:2px}
.dest{font-size:13px;color:var(--dim);margin-top:2px}
.items{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.6;padding-top:8px;border-top:1px solid rgba(242,237,227,.10)}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.age{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:100px;white-space:nowrap;border:1px solid transparent;
}
.age b{
  font-weight:600;font-size:11px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
.age-ok   {color:var(--dim);border-color:var(--faint)}
.age-amber{color:var(--catch);border-color:rgba(255,184,77,.5);background:rgba(255,184,77,.10)}
.age-red  {color:#fff;background:var(--coral);font-weight:600}
.placed{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:rgba(242,237,227,.42);margin-top:8px;
}
.contact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}
.contact a{
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-decoration:none;
  padding:6px 11px;border:1px solid var(--faint);border-radius:3px;
  color:var(--foam);transition:border-color .18s,background .18s;
}
.contact a:hover{border-color:var(--foam);background:rgba(127,212,193,.10)}
.contact.nonum{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--coral)}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:100px;white-space:nowrap}
.p1{background:rgba(242,237,227,.15);color:var(--sand)}
.p2{background:rgba(127,212,193,.22);color:var(--foam)}
.p3{background:var(--catch);color:var(--abyss)}
.p4{background:var(--foam);color:var(--abyss)}
.pX{background:var(--coral);color:#fff}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{flex:1;min-width:120px;padding:11px;border:1px solid var(--faint);background:transparent;border-radius:3px;color:var(--sand);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.act:hover{border-color:var(--foam);color:var(--foam)}
.act.go{background:var(--catch);border-color:var(--catch);color:var(--abyss);font-weight:600}
.act.go:hover{background:#ffc76d;color:var(--abyss)}
.act:disabled{opacity:.45;cursor:not-allowed}

.msg{padding:13px 15px;border-radius:3px;font-size:14px;margin-bottom:16px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(255,107,90,.12);border:1px solid var(--coral);border-left-width:3px}
.msg.ok{background:rgba(127,212,193,.12);border:1px solid var(--foam);border-left-width:3px;color:var(--foam)}
.empty{text-align:center;padding:46px 20px;color:var(--dim);font-size:14px}
.hidden{display:none}

/* delivery type marker on each order */
.dtype{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;margin-left:8px;vertical-align:middle}
.d-mombasa{background:rgba(255,184,77,.20);color:var(--catch)}
.d-upcountry{background:rgba(127,212,193,.16);color:var(--foam)}
.d-pickup{background:rgba(242,237,227,.14);color:var(--dim)}

/* dispatch sheet */
.sheet{position:fixed;inset:0;background:rgba(3,42,46,.86);-webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{width:100%;max-width:640px;background:#06383D;border:1px solid var(--faint);
  border-radius:8px 8px 0 0;padding:22px 18px 28px;max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-size:17px;margin-bottom:3px}
.sheet .for{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--foam);margin-bottom:16px}
.sheet .opt{font-size:12px;color:var(--dim);margin:-8px 0 14px}
.sheet-acts{display:flex;gap:9px;margin-top:6px}
.sheet-acts .btn{flex:2}
.ghost{flex:1;padding:15px;background:transparent;border:1px solid var(--faint);border-radius:3px;
  color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.ghost:hover{border-color:var(--sand);color:var(--sand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bg" role="presentation"></div>
<div class="wrap">

  <header>
    <div class="brand">Mombasafish <em>Dispatch</em></div>
    <div class="sub">Staff only</div>
    <div class="who hidden" id="who">
      <span id="whoName"></span>
      <button class="link" id="out">Sign out</button>
    </div>
  </header>

  <div class="msg" id="msg"></div>

  <!-- LOGIN -->
  <section id="loginView">
    <div class="card">
      <h1>Sign in</h1>
      <p class="lead">Use the email and password you were given.</p>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" inputmode="email">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="in">Sign in</button>
    </div>
  </section>

  <!-- ORDERS -->
  <section id="appView" class="hidden">
    <div class="tabs">
      <button class="tab on" data-f="todo">To dispatch</button>
      <button class="tab" data-f="road">On the road</button>
      <button class="tab" data-f="done">Arrived</button>
    </div>
    <div id="list"></div>
  </section>

</div>

<!-- dispatch sheet -->
<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h2>Dispatch order</h2>
    <div class="for" id="sheetFor"></div>

    <div id="riderFields">
      <label for="rn">Rider / driver name</label>
      <input id="rn" type="text" autocomplete="off">
      <label for="rp">Rider phone</label>
      <input id="rp" type="tel" autocomplete="off" inputmode="tel">
      <p class="opt">Optional. Leave blank if your own staff is delivering — the customer just sees the status.</p>
    </div>

    <div id="etaWrap">
      <label for="eta">Note for the customer</label>
      <input id="eta" type="text" autocomplete="off">
      <p class="opt" id="etaHint"></p>
    </div>

    <div class="sheet-acts">
      <button class="ghost" id="sheetCancel">Cancel</button>
      <button class="btn" id="sheetGo">Dispatch</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://tcpqbrchpxpshmqprbkv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7YLqP3JMq8AFZQl4XF--bw_itOMj1gA';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const STAGE = {1:['Confirmed','p1'],2:['Packed','p2'],3:['On the road','p3'],4:['Arrived','p4'],'-1':['Cancelled','pX']};
let orders = [], filter = 'todo';

function note(text, kind='ok'){
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg on ' + kind;
  clearTimeout(note._t);
  note._t = setTimeout(()=>m.className='msg', 4000);
}

async function signIn(){
  const btn = $('in'); btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ note(error.message, 'err'); return; }
  boot();
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); $('who').classList.add('hidden'); return; }

  const { data:staff } = await sb.from('mfm_staff').select('full_name, role').eq('user_id', session.user.id).maybeSingle();
  if(!staff){
    note('This account is not registered as staff. Ask Hemed to add you.', 'err');
    await sb.auth.signOut();
    return;
  }

  $('whoName').textContent = (staff.full_name || session.user.email) + ' · ' + staff.role;
  $('who').classList.remove('hidden');
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  await load();
}

async function load(){
  const { data, error } = await sb.from('mfm_orders')
    .select('order_number, customer_name, contact, destination, items, stage, created_at, stage_changed_at, dispatched_at, delivery_type, rider_name, rider_phone, eta_note')
    .order('date_ordered', { ascending:true });
  if(error){ note(error.message,'err'); return; }
  orders = data || [];
  render();
}

const DTYPE = { mombasa:'Mombasa', upcountry:'Upcountry', pickup:'Pickup' };

/* Elapsed time. Thresholds tighten once fish is on ice — a packed order
   sitting 8 hours is a cold-chain problem, a confirmed one is not. */
const URGENCY = {
  1: [24, 48],   // confirmed, not yet packed
  2: [6,  12],   // ON ICE — dispatch fast
  3: [36, 72],   // in transit; upcountry runs overnight
  4: [0,   0]
};

function elapsed(iso){
  if(!iso) return null;
  const secs = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000));
  const d = Math.floor(secs / 86400);
  const h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  const p = n => String(n).padStart(2,'0');
  return {
    mins: Math.floor(secs / 60),
    text: (d ? d + 'd ' : '') + `${p(h)}:${p(m)}:${p(s)}`
  };
}

function ageClass(mins, stage){
  const [amber, red] = URGENCY[stage] || [24, 48];
  if(!amber) return 'age-ok';
  const hrs = mins / 60;
  return hrs >= red ? 'age-red' : hrs >= amber ? 'age-amber' : 'age-ok';
}

function stamp(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('en-GB',
    { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function render(){
  const sets = { todo:o=>o.stage===1||o.stage===2, road:o=>o.stage===3, done:o=>o.stage===4||o.stage===-1 };
  const rows = orders.filter(sets[filter]);
  if(!rows.length){ $('list').innerHTML = '<div class="empty">Nothing here right now.</div>'; return; }

  $('list').innerHTML = rows.map(o=>{
    const [label, cls] = STAGE[o.stage] || ['—','p1'];
    const dt = o.delivery_type || 'upcountry';
    let acts = '';
    if(o.stage===1) acts = `<button class="act" data-s="2" data-o="${o.order_number}">Mark ${dt==='mombasa'?'prepared':'packed'}</button>
                            <button class="act go" data-d="${o.order_number}">Dispatch →</button>`;
    else if(o.stage===2) acts = `<button class="act go" data-d="${o.order_number}">Dispatch →</button>`;
    else if(o.stage===3) acts = `<button class="act" data-s="4" data-o="${o.order_number}">Mark ${dt==='pickup'?'collected':'arrived'}</button>`;
    const rider = (o.stage>=3 && (o.rider_name||o.rider_phone))
      ? `<div class="items">🛵 ${o.rider_name||'Rider'}${o.rider_phone?' · '+o.rider_phone:''}</div>` : '';
    const tel = o.contact ? o.contact.replace(/[^0-9+]/g,'') : '';
    const wa  = tel.replace(/^\+/,'').replace(/^0/,'254');
    const contact = o.contact
      ? `<div class="contact">
           <a href="tel:${tel}">📞 ${o.contact}</a>
           <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>
         </div>`
      : `<div class="contact nonum">No phone number on file</div>`;
    const STAGE_VERB = {1:'confirmed',2:'packed',3:'dispatched',4:'done'};
    const inStage = elapsed(o.stage_changed_at || o.created_at);
    const since   = elapsed(o.created_at);
    const ageBadge = inStage && o.stage !== 4
      ? `<span class="age ${ageClass(inStage.mins, o.stage)}" data-since="${o.stage_changed_at || o.created_at}" data-stage="${o.stage}" data-verb="${STAGE_VERB[o.stage]||''}"><b>${inStage.text}</b> ${STAGE_VERB[o.stage]||''}</span>`
      : '';
    const placed = `<div class="placed">Ordered ${stamp(o.created_at)}${since ? ' · ' + since.text : ''}</div>`;

    return `<div class="order">
      <div class="order-top">
        <div>
          <div class="ono">${o.order_number}<span class="dtype d-${dt}">${DTYPE[dt]}</span></div>
          <div class="cust">${o.customer_name || 'Customer'}</div>
          <div class="dest">${o.destination || ''}</div>
        </div>
        <div class="pills"><span class="pill ${cls}">${label}</span>${ageBadge}</div>
      </div>
      ${placed}
      ${contact}
      ${o.items ? `<div class="items">${o.items}</div>` : ''}
      ${rider}
      ${acts ? `<div class="acts">${acts}</div>` : ''}
    </div>`;
  }).join('');
}

async function setStage(orderNo, stage, btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
  const { error } = await sb.rpc('set_stage', { p_order: orderNo, p_stage: stage });
  if(error){ note(error.message,'err'); btn.disabled=false; btn.textContent=old; return; }
  note(`${orderNo} → ${STAGE[stage][0]}. The customer's tracking link is now live.`);
  await load();
}

/* ---- dispatch sheet ---- */
let pending = null;

function openSheet(orderNo){
  const o = orders.find(x => x.order_number === orderNo);
  if(!o) return;
  pending = o;
  const dt = o.delivery_type || 'upcountry';

  $('sheetFor').textContent = `${o.order_number} · ${o.customer_name || 'Customer'} · ${o.destination || ''}`;
  $('rn').value = o.rider_name || '';
  $('rp').value = o.rider_phone || '';
  $('eta').value = o.eta_note || '';

  // Rider details only make sense when something is actually being carried
  $('riderFields').classList.toggle('hidden', dt === 'pickup');

  if(dt === 'mombasa'){
    $('eta').placeholder = 'e.g. 30–60 minutes';
    $('etaHint').textContent = 'Shown to the customer while the rider is on the way.';
  } else if(dt === 'pickup'){
    $('eta').placeholder = 'e.g. Ready at the shop until 6pm';
    $('etaHint').textContent = 'Tell them where and when to collect.';
  } else {
    $('eta').placeholder = 'e.g. Smart Coach, arriving tomorrow morning';
    $('etaHint').textContent = 'Which bus or courier, and when to expect it.';
  }
  $('sheet').classList.add('on');
}

function closeSheet(){ $('sheet').classList.remove('on'); pending = null; }

async function doDispatch(){
  if(!pending) return;
  const btn = $('sheetGo'); btn.disabled = true; btn.textContent = 'Dispatching…';
  const { error } = await sb.rpc('dispatch_order', {
    p_order: pending.order_number,
    p_rider_name: $('rn').value,
    p_rider_phone: $('rp').value,
    p_eta: $('eta').value
  });
  btn.disabled = false; btn.textContent = 'Dispatch';
  if(error){ note(error.message,'err'); return; }
  note(`${pending.order_number} dispatched. The customer's link is live.`);
  closeSheet();
  await load();
}

$('sheetGo').addEventListener('click', doDispatch);
$('sheetCancel').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });

$('in').addEventListener('click', signIn);
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
$('out').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); filter = t.dataset.f; render();
}));

$('list').addEventListener('click', e=>{
  const d = e.target.closest('[data-d]');
  if(d){ openSheet(d.dataset.d); return; }
  const b = e.target.closest('.act');
  if(b && b.dataset.s) setStage(b.dataset.o, Number(b.dataset.s), b);
});

boot();

/* Tick every second, touching only the digits — never re-rendering the list
   or refetching from the database. */
setInterval(() => {
  document.querySelectorAll('.age[data-since]').forEach(el => {
    const e = elapsed(el.dataset.since);
    if(!e) return;
    const b = el.querySelector('b');
    if(b) b.textContent = e.text;
    const cls = ageClass(e.mins, Number(el.dataset.stage));
    if(!el.classList.contains(cls)){
      el.classList.remove('age-ok','age-amber','age-red');
      el.classList.add(cls);
    }
  });
}, 1000);

/* Refresh from the database occasionally so another staff member's taps show up */
setInterval(() => { if(orders.length) load(); }, 120000);
</script>
</body>
</html>
