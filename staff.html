<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test Label Clickable</title>
<style>
body{font-family:sans-serif;background:#032A2E;color:#fff;padding:20px}
.act{padding:10px 14px;border:1px solid #7FD4C1;background:rgba(127,212,193,.15);color:#7FD4C1;border-radius:4px;cursor:pointer;font-family:monospace}
.label-sheet{position:fixed;inset:0;background:rgba(3,42,46,.94);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.label-sheet.on{display:flex}
.label-sheet-in{width:100%;max-width:860px;background:#06383D;padding:16px;border-radius:8px}
</style></head><body>
<h2>Test: Is A4 Label clickable?</h2>
<button class="act" onclick="openLabelSheet('MFM-TEST123')" style="border-color:#7FD4C1;color:#7FD4C1;background:rgba(127,212,193,.15);cursor:pointer">🏷️ A4 Label (TEST)</button>
<div id="status" style="margin-top:12px;color:#7FD4C1"></div>

<div class="label-sheet" id="labelSheet">
  <div class="label-sheet-in">
    <div style="display:flex;justify-content:space-between"><h3>Label Preview - NO SCUBA - BEST MOSAIC</h3><button onclick="closeLabelSheet()">✕ Close</button></div>
    <div id="labelPage" style="margin-top:12px;background:#fff;padding:4px;border-radius:8px"></div>
    <div style="margin-top:8px;font-size:12px">✅ If you see this modal, button IS clickable</div>
  </div>
</div>

<script>
let orders=[{order_number:'MFM-TEST123',customer_name:'Test Customer Hemed',destination:'Mombasa, Nyali',customer_phone:'0787668888',delivery_address:'Nyali Beach'}];
function generateLabelHTML(orderNo){
  const o=orders.find(x=>x.order_number===orderNo);
  return '<div style="position:relative;width:100%;background:#fff"><img src="data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoQABAAC0YJaQBOgA1MAAA" style="width:100%;height:200px;background:linear-gradient(90deg,#7FD4C1,#032A2E);display:block"><div style="position:absolute;left:15%;top:30%;color:#0A2A5E;font-weight:700">'+o.customer_name+'</div><div style="position:absolute;left:15%;top:45%;color:#0A2A5E">'+o.destination+'</div><div style="position:absolute;left:15%;top:60%;color:#0A2A5E">'+o.order_number+' - BEST IMAGE NO SCUBA - FISH ONLY</div></div>';
}
function openLabelSheet(orderNo){
  document.getElementById('status').textContent='✅ CLICKED! Opening '+orderNo+' - button IS clickable';
  document.getElementById('labelPage').innerHTML=generateLabelHTML(orderNo);
  document.getElementById('labelSheet').classList.add('on');
  console.log('Label clicked',orderNo);
}
function closeLabelSheet(){document.getElementById('labelSheet').classList.remove('on');}
</script>
</body></html>
