<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Growth · Mombasafish</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#032A2E; --deep:#07474C; --deep2:#06383D; --foam:#7FD4C1; --catch:#FFB84D;
  --coral:#FF6B5A; --sand:#F2EDE3; --dim:#9db0ad; --faint:rgba(242,237,227,.15); --green:#4ade80;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --display:'Archivo Black',Impact,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--abyss);color:var(--sand)}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
a{color:var(--foam)}

/* sign-in */
.login{max-width:380px;margin:56px auto;padding:0 18px}
.brand{font-family:var(--display);font-size:24px;text-align:center;letter-spacing:.5px}
.brand b{color:var(--foam);font-weight:400}
.tagline{font-family:var(--mono);font-size:11px;color:var(--catch);letter-spacing:.15em;text-transform:uppercase;text-align:center;margin:6px 0 24px}
label,.lbl{display:block;font-size:11.5px;color:var(--dim);margin:12px 0 5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--faint);background:#062f33;color:var(--sand);font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--foam);outline-offset:1px}
.btn{display:inline-block;padding:12px 16px;border:none;border-radius:8px;background:var(--foam);color:var(--abyss);font-weight:700;font-size:13px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn.full{width:100%;margin-top:16px}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--faint);color:var(--sand)}
.btn.bad{background:transparent;border:1px solid rgba(255,107,90,.55);color:var(--coral)}
.btn.good{background:var(--foam);color:var(--abyss)}
.btn.sm{padding:7px 11px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--dim);margin-top:10px;text-align:center}

/* frame */
header{position:sticky;top:0;z-index:20;background:rgba(3,42,46,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--faint)}
.hbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:980px;margin:0 auto}
.htitle{font-family:var(--display);font-size:15px;letter-spacing:.3px}
.htitle b{color:var(--foam);font-weight:400}
.hright{display:flex;gap:8px;align-items:center}
.who{font-family:var(--mono);font-size:11px;color:var(--dim)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:980px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:8px 12px;border-radius:7px;border:1px solid var(--faint);background:transparent;color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap}
nav button.on{border-color:var(--foam);background:rgba(127,212,193,.14);color:var(--foam);font-weight:600}
nav button .dot{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--catch);color:var(--abyss);font-size:10.5px;font-weight:700;text-align:center}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px}
h2{font-size:12.5px;color:var(--foam);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin:26px 0 10px}
h2:first-child{margin-top:6px}
h2 small{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
.muted{color:var(--dim)} .small{font-size:12.5px} .mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.kpi{background:var(--deep);border:1px solid var(--faint);border-radius:11px;padding:13px 14px}
.kpi b{display:block;font-size:22px;font-family:var(--mono);color:var(--foam);line-height:1.2}
.kpi span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.kpi small{display:block;color:var(--dim);font-size:11px;margin-top:4px;font-family:var(--mono)}
.kpi small.up{color:var(--green)} .kpi small.down{color:var(--coral)}
.kpi.warn b{color:var(--catch)}

.card{background:var(--deep);border:1px solid var(--faint);border-radius:11px;padding:14px;margin-bottom:9px}
.card h3{margin:0 0 4px;font-size:15px}
.card .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.card p{margin:8px 0}
.note{background:rgba(255,184,77,.10);border:1px solid rgba(255,184,77,.32);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--catch);margin-top:10px}
.note.info{background:rgba(127,212,193,.08);border-color:rgba(127,212,193,.3);color:var(--foam)}
.empty{text-align:center;color:var(--dim);padding:26px 10px;border:1px dashed var(--faint);border-radius:11px;font-size:13.5px}

.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--faint);color:var(--dim)}
.pill.good{border-color:rgba(74,222,128,.5);color:var(--green)}
.pill.warn{border-color:rgba(255,184,77,.5);color:var(--catch)}
.pill.bad{border-color:rgba(255,107,90,.5);color:var(--coral)}
.pill.info{border-color:rgba(127,212,193,.5);color:var(--foam)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:400;padding:7px 8px;border-bottom:1px solid var(--faint);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid rgba(242,237,227,.07);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto;background:var(--deep);border:1px solid var(--faint);border-radius:11px;padding:4px 6px}

/* bars */
.bars{background:var(--deep);border:1px solid var(--faint);border-radius:11px;padding:12px 14px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{display:block;height:10px;background:rgba(242,237,227,.06);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--foam);border-radius:5px}
.bar .fill.alt{background:var(--catch)}
.bar .val{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}

.month{display:flex;gap:8px;align-items:center}
.month select{width:auto;padding:7px 10px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
details.more{background:var(--deep);border:1px solid var(--faint);border-radius:11px;padding:12px 14px;margin-bottom:9px}
details.more summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--foam);text-transform:uppercase;letter-spacing:.06em}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.linkout{font-family:var(--mono);font-size:12px;word-break:break-all;background:#062f33;border:1px solid var(--faint);border-radius:7px;padding:8px 10px;margin-top:6px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;background:#0b5a60;color:var(--sand);border:1px solid var(--foam);padding:11px 16px;border-radius:9px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.err{background:#5a1a14;border-color:var(--coral)}
.links{text-align:center;padding:22px 0 0;font-family:var(--mono);font-size:12px}
.links a{margin:0 8px;text-decoration:none}
</style>
</head>
<body>

<section class="login hidden" id="loginView">
  <div class="brand">MOMBASA<b>FISH</b></div>
  <div class="tagline">Growth department · owner only</div>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn full" id="signinBtn">Sign in</button>
</section>

<section class="login hidden" id="codeView">
  <div class="brand">MOMBASA<b>FISH</b></div>
  <div class="tagline">Enter the code from your email</div>
  <p class="msg" id="codeSentTo">Sending a 6-digit code to your email…</p>
  <label for="codeIn">6-digit code</label>
  <input id="codeIn" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  <button class="btn full" id="codeGo">Verify and continue</button>
  <button class="btn ghost full" id="codeResend" disabled>Send a new code</button>
</section>

<section class="login hidden" id="deniedView">
  <div class="brand">MOMBASA<b>FISH</b></div>
  <p class="msg" style="color:var(--coral)">The growth page is for the owner only. This account does not have owner access.</p>
  <button class="btn ghost full" data-act="signout">Sign out</button>
</section>

<div id="appView" class="hidden">
  <header>
    <div class="hbar">
      <div class="htitle">MOMBASA<b>FISH</b> GROWTH</div>
      <div class="hright"><span class="who" id="who"></span><button class="btn ghost sm" data-act="signout">Exit</button></div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="decide">To decide<span class="dot hidden" id="decideDot"></span></button>
      <button data-tab="followups">Follow-ups<span class="dot hidden" id="fuDot"></span></button>
      <button data-tab="campaigns">Campaigns</button>
      <button data-tab="channels">Channels</button>
      <button data-tab="content">Content</button>
      <button data-tab="customers">Customers</button>
      <button data-tab="sourcing">Sourcing</button>
      <button data-tab="products">Products</button>
      <button data-tab="places">Places</button>
      <button data-tab="wholesale">Wholesale</button>
      <button data-tab="agents">Agents</button>
    </nav>
  </header>
  <main class="wrap" id="main"></main>
  <div class="links wrap"><a href="./dashboard.html">Dashboard</a>·<a href="./staff.html">Dispatch</a>·<a href="./wholesale.html">Wholesale</a>·<a href="./radar.html">Radar</a></div>
</div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SUPABASE_URL = 'https://tcpqbrchpxpshmqprbkv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7YLqP3JMq8AFZQl4XF--bw_itOMj1gA';
const SITE = 'https://mombasafish.com';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v == null || v === '' ? null : Number(v);
const n0 = v => v == null ? '–' : Number(v).toLocaleString('en-KE', {maximumFractionDigits: 0});
const n1 = v => v == null ? '–' : Number(v).toLocaleString('en-KE', {maximumFractionDigits: 1});
const kes = v => v == null ? '–' : 'KES ' + n0(v);
const kg = v => v == null ? '–' : n1(v) + ' kg';
const TZ = 'Africa/Nairobi';
const day = t => t ? new Date(t).toLocaleDateString('en-GB', {timeZone: TZ, day: 'numeric', month: 'short', year: 'numeric'}) : '–';
const stamp = t => t ? new Date(t).toLocaleString('en-GB', {timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
const monthName = m => new Date(m + (m.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-GB', {month: 'long', year: 'numeric'});
const todayISO = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const monthStart = d => d.slice(0, 7) + '-01';
function pct(a, b){ if(a == null || b == null || !Number(b)) return null; return Math.round((a - b) / b * 100); }

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args || {});
  if(error) throw new Error(error.message);
  return data;
}
let toastT;
function toast(text, kind){
  const t = $('toast'); t.textContent = text; t.className = kind === 'err' ? 'err' : '';
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), kind === 'err' ? 6000 : 3500);
}
async function act(btn, fn, okMsg){
  if(btn) btn.disabled = true;
  try{ await fn(); if(okMsg) toast(okMsg); await refresh(); }
  catch(e){ toast(e.message, 'err'); }
  finally{ if(btn) btn.disabled = false; }
}

const CHANNEL = {tiktok:'TikTok', meta:'Instagram / Facebook', whatsapp:'WhatsApp', youtube:'YouTube', search:'Google search',
  ai_assistant:'AI assistant', direct:'Website, no tag', other:'Other', repeat:'Bought before', referral:'Friend told them',
  walk_in:'Walk-in', broadcast:'Our broadcast', unknown:'Not recorded'};
const AGENT = {sourcing:'Sourcing', followup:'Follow-up', director:'Growth Director', content:'Content', acquisition:'Acquisition', retention:'Retention', wholesale:'Wholesale',
  product:'Product', distribution:'Distribution', revenue:'Revenue'};
const ACTION = {analyse_sales:'Analyse sales', recommend_campaign:'Recommend a campaign', draft_social_content:'Draft social content',
  prepare_wholesale_prospects:'Prepare wholesale prospects', draft_customer_message:'Draft customer messages',
  publish_social_content:'Publish social content', send_marketing_message:'Send marketing messages', change_product_price:'Change a product price',
  issue_discount:'Give a discount', launch_paid_ads:'Launch paid ads', commit_supplier_stock:'Commit supplier stock', confirm_delivery_promise:'Promise a delivery date'};
const CSTAT = {Draft:'', Review:'warn', Approved:'info', Scheduled:'info', Active:'good', Completed:'', Analysed:'good', Rejected:'bad'};
const NEXT = {Draft:['Review','Rejected'], Review:['Approved','Draft','Rejected'], Approved:['Scheduled','Active','Draft'], Scheduled:['Active','Draft'],
  Active:['Completed'], Completed:['Analysed'], Rejected:['Draft'], Analysed:[]};
const NEXT_LABEL = {Review:'Send to review', Approved:'Approve', Scheduled:'Mark scheduled', Active:'Mark live', Completed:'Mark finished',
  Analysed:'Mark analysed', Draft:'Back to draft', Rejected:'Reject'};

/* ---------- state ---------- */
const S = { tab: 'overview', month: monthStart(todayISO()), cache: {}, editCampaign: null, importRows: null };
try{ const t = localStorage.getItem('growth_tab'); if(t) S.tab = t; }catch(_){}

async function load(key, fn){ if(!(key in S.cache)) S.cache[key] = await fn(); return S.cache[key]; }
const view = (name, from, to, limit) => rpc('growth_view', {p_view: name, p_from: from || null, p_to: to || null, p_limit: limit || 500});
const list = (kind, limit) => rpc('growth_list', {p_kind: kind, p_limit: limit || 200});

/* ---------- auth ---------- */
function show(id){ ['loginView','codeView','deniedView','appView'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function sendCode(){
  const msg = $('codeSentTo'), btn = $('codeResend');
  btn.disabled = true; msg.textContent = 'Sending a 6-digit code to your email…';
  try{ const r = await rpc('mfm_staff_send_login_code'); msg.textContent = `We emailed a 6-digit code to ${r.sent_to}. It works for 10 minutes and can take a minute to arrive. Check spam if you don't see it.`; }
  catch(e){ msg.textContent = /just sent/i.test(e.message) ? 'We emailed you a code a moment ago. Check your inbox (and spam).' : e.message; }
  setTimeout(() => btn.disabled = false, 45000);
}
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return show('loginView');
  const codeOk = await rpc('mfm_staff_code_ok').catch(() => false);
  if(!codeOk){
    show('codeView'); $('codeIn').value = ''; setTimeout(() => $('codeIn').focus(), 50);
    const key = session.access_token.slice(-16);
    if(boot._sentFor !== key){ boot._sentFor = key; sendCode(); }
    return;
  }
  const owner = await rpc('growth_owner_ok').catch(() => false);
  if(!owner) return show('deniedView');
  $('who').textContent = session.user.email;
  show('appView');
  setTab(S.tab);
}
$('signinBtn').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true;
  const { error } = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  b.disabled = false;
  if(error) return toast(error.message, 'err');
  boot();
});
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('signinBtn').click(); });
$('codeGo').addEventListener('click', async e => {
  const code = $('codeIn').value.replace(/\D/g, '');
  if(code.length !== 6) return toast('Enter the 6-digit code from the email.', 'err');
  const b = e.currentTarget; b.disabled = true;
  try{
    const ok = await rpc('mfm_w_verify_login_code', {p_code: code});
    if(!ok){ $('codeIn').value = ''; return toast('That code is not right. Use the newest email and try again.', 'err'); }
    boot();
  }catch(err){ toast(err.message, 'err'); }
  finally{ b.disabled = false; }
});
$('codeIn').addEventListener('input', e => { if(e.target.value.replace(/\D/g, '').length === 6) $('codeGo').click(); });
$('codeResend').addEventListener('click', sendCode);
sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT') show('loginView'); });

/* ---------- tabs ---------- */
function setTab(t){
  S.tab = t;
  try{ localStorage.setItem('growth_tab', t); }catch(_){}
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });
async function refresh(){ S.cache = {}; await render(); }

async function render(){
  const main = $('main');
  if(!main.innerHTML) main.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const ov = await load('ov:' + S.month, () => rpc('growth_overview', {p_month: S.month}));
    const pend = ov.pending_decisions || {};
    const nPend = (pend.opportunities || 0) + (pend.actions || 0) + (pend.drafts || 0);
    load('fu', () => rpc('growth_followups_list', {p_include_done: false})).then(fu => {
      const n = fu.filter(f => f.status === 'new').length; $('fuDot').textContent = n; $('fuDot').classList.toggle('hidden', !n);
    }).catch(() => {});
    $('decideDot').textContent = nPend; $('decideDot').classList.toggle('hidden', !nPend);
    main.innerHTML = await (VIEWS[S.tab] || VIEWS.overview)(ov);
  }catch(e){
    main.innerHTML = `<div class="empty">Could not load this page: ${esc(e.message)}</div>`;
  }
}

function monthPicker(){
  const opts = []; const d = new Date(todayISO() + 'T00:00:00');
  for(let i = 0; i < 12; i++){
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const v = m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0') + '-01';
    if(v < '2026-07-01') break;
    opts.push(`<option value="${v}"${v === S.month ? ' selected' : ''}>${monthName(v)}</option>`);
  }
  return `<div class="month"><select data-change="month" aria-label="Month">${opts.join('')}</select></div>`;
}
function bars(rows, labelFn, valFn, fmt, alt){
  if(!rows.length) return '<div class="empty">Nothing recorded for this period.</div>';
  const max = Math.max(...rows.map(r => Number(valFn(r) || 0)), 1);
  return '<div class="bars">' + rows.map(r => `<div class="bar"><span class="lab" title="${esc(labelFn(r))}">${esc(labelFn(r))}</span>
    <span class="track"><span class="fill${alt ? ' alt' : ''}" style="width:${Math.max(2, Number(valFn(r) || 0) / max * 100)}%"></span></span>
    <span class="val">${fmt(r)}</span></div>`).join('') + '</div>';
}
function kpi(label, value, sub, cls){ return `<div class="kpi${cls ? ' ' + cls : ''}"><b>${value}</b><span>${esc(label)}</span>${sub || ''}</div>`; }
function delta(cur, prev, unit){
  if(S.month === monthStart(todayISO())) return prev == null ? '' : `<small>last month: ${n0(prev)}${unit ? ' ' + unit : ''}</small>`;
  const p = pct(cur, prev);
  if(p == null) return '<small>no earlier month to compare</small>';
  return `<small class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}% vs last month${unit ? ' ' + unit : ''}</small>`;
}

/* ---------- views ---------- */
const VIEWS = {
  async overview(ov){
    const m = ov.month_row || {}, p = ov.prev_month_row || {};
    const isNow = S.month === monthStart(todayISO());
    const [monthly, channels, products] = await Promise.all([
      load('monthly', () => view('monthly_sales_performance', '2026-07-01', null)),
      load('ch:' + S.month, () => view('campaign_conversion_summary', S.month, S.month)),
      load('pr:' + S.month, () => view('product_sales_performance', S.month, S.month)),
    ]);
    const months = [...monthly].sort((a, b) => a.order_month < b.order_month ? -1 : 1);
    const chAgg = {}; channels.forEach(c => { chAgg[c.channel] = (chAgg[c.channel] || 0) + Number(c.orders_through || 0); });
    const chRows = Object.entries(chAgg).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(([channel, n]) => ({channel, n}));
    const prAgg = {}; products.filter(r => !r.is_packaging).forEach(r => { const k = r.product; prAgg[k] = prAgg[k] || {product: k, orders: 0, kg: 0}; prAgg[k].orders += Number(r.orders || 0); prAgg[k].kg += Number(r.kg || 0); });
    const prRows = Object.values(prAgg).sort((a, b) => b.orders - a.orders).slice(0, 8);
    const basketOnly = Number(m.orders_basket_only || 0);
    const wm = ov.wholesale_month || {};
    return `
      <div class="row"><h2 style="margin:6px 0">${esc(monthName(S.month))}${isNow ? ' <small>· so far</small>' : ''}</h2><span class="spacer"></span>${monthPicker()}</div>
      <div class="kpis">
        ${isNow ? kpi('Orders today', n0(ov.orders_today || 0), '<small>paid, not cancelled</small>') : ''}
        ${kpi('Orders through', n0(m.orders_through || 0), delta(m.orders_through, p.orders_through))}
        ${kpi('New customers', n0(m.new_customers || 0), delta(m.new_customers, p.new_customers))}
        ${kpi('Returning customers', n0(m.returning_customers || 0), `<small>${m.customers ? Math.round((m.returning_customers || 0) / m.customers * 100) : 0}% of buyers</small>`)}
        ${kpi('Value', kes(m.value_kes), `<small>${basketOnly ? basketOnly + ' orders at website basket' : 'amounts received'}</small>`)}
        ${kpi('Average order', kes(m.avg_order_value_kes), S.month === monthStart(todayISO()) ? (p.avg_order_value_kes != null ? `<small>last month: ${kes(p.avg_order_value_kes)}</small>` : '') : delta(m.avg_order_value_kes, p.avg_order_value_kes))}
        ${kpi('Kilograms', kg(m.kg_sold), '<small>lines priced by weight</small>')}
        ${kpi('Cancelled', (m.cancel_rate_pct ?? '–') + '%', `<small>${n0(m.orders_cancelled || 0)} of ${n0(m.orders_placed || 0)} placed</small>`, Number(m.cancel_rate_pct) >= 25 ? 'warn' : '')}
        ${kpi('Counties', n0(ov.active_destinations || 0), '<small>retail + wholesale</small>')}
        ${kpi('From a known channel', n0(ov.campaign_attributed_orders || 0), `<small>of ${n0(m.orders_through || 0)} orders</small>`)}
        ${kpi('Wholesale', n0(wm.orders || 0) + ' orders', `<small>${kes(wm.value_kes)} · ${n0(ov.wholesale_accounts || 0)} accounts</small>`)}
        ${kpi('Marketing spend', kes(ov.marketing_spend_kes), '<small>entered on the Campaigns tab</small>')}
      </div>

      <h2>Orders by month <small>· paid, not cancelled</small></h2>
      ${bars(months, r => monthName(r.order_month).replace(/ \d{4}$/, ''), r => r.orders_through, r => `${n0(r.orders_through)} · ${kes(r.value_kes)}`)}

      <h2>Where this month's orders came from</h2>
      ${bars(chRows, r => CHANNEL[r.channel] || r.channel, r => r.n, r => n0(r.n) + ' orders', true)}
      ${chAgg.unknown || chAgg.direct ? `<div class="note">${n0((chAgg.unknown || 0) + (chAgg.direct || 0))} orders have no channel. Tagged links in your bios and "Where did they find us?" on Dispatch fill this in.</div>` : ''}

      <h2>Top products this month <small>· by orders</small></h2>
      ${bars(prRows, r => r.product, r => r.orders, r => `${n0(r.orders)} order${r.orders === 1 ? '' : 's'}${r.kg ? ' · ' + kg(r.kg) : ''}`)}

      <div class="note info">${(ov.notes || []).map(esc).join('<br>')}</div>`;
  },

  async followups(){
    const fu = await load('fu', () => rpc('growth_followups_list', {p_include_done: false}));
    const KIND = {payment_reminder:'Payment reminder', paid_not_packed:'Paid, not packed', packed_not_sent:'Packed, not sent', on_road_long:'Long on the road',
      refund_due:'Refund owed', delivered_thanks:'Thank you after delivery', reorder:'Reorder invite'};
    const fill = f => String(f.message || '').replace(/\{name\}/g, f.first_name || '').replace(/\{tracking\}/g, f.tracking_code || '').replace(/\{order\}/g, f.order_number);
    const open = fu.filter(f => f.status === 'new'), done = fu.filter(f => f.status !== 'new');
    const card = f => {
      const msg = fill(f);
      const wa = f.wa_number && f.audience === 'customer' ? `https://wa.me/${encodeURIComponent(f.wa_number)}?text=${encodeURIComponent(msg)}` : '';
      return `<div class="card"${f.status !== 'new' ? ' style="opacity:.55"' : ''}>
        <div class="row"><h3>${esc(KIND[f.kind] || f.kind)} · ${esc(f.order_number)}</h3><span class="spacer"></span>
          <span class="pill ${f.priority === 'high' ? 'bad' : f.priority === 'medium' ? 'warn' : ''}">${esc(f.priority)}</span>
          ${f.audience === 'staff' ? '<span class="pill info">for the team</span>' : ''}${f.status !== 'new' ? `<span class="pill good">${esc(f.status)}</span>` : ''}</div>
        <div class="meta">${esc(f.customer_name || '')}${f.destination ? ' · ' + esc(f.destination) : ''} · order now: ${esc(f.order_status || '')} · listed ${stamp(f.created_at)}</div>
        <p class="small">${esc(f.reason)}</p>
        ${!f.still_relevant && f.status === 'new' ? '<div class="note">The order has moved on since this was listed — probably not needed any more.</div>' : ''}
        ${msg ? `<div class="linkout" style="white-space:pre-wrap;font-family:inherit;font-size:14px">${esc(msg)}</div>` : ''}
        ${f.status === 'new' ? `<div class="acts">
          ${wa ? `<a class="btn sm" href="${esc(wa)}" target="_blank" rel="noopener" data-act="fu-open" data-id="${f.id}">Open WhatsApp</a>` : ''}
          ${msg ? `<button class="btn ghost sm" data-act="copy" data-text="${esc(msg)}">Copy</button>` : ''}
          <button class="btn ${wa ? 'ghost' : ''} sm" data-act="fu" data-id="${f.id}" data-s="${f.audience === 'staff' ? 'done' : 'sent'}">${f.audience === 'staff' ? 'Done' : 'Mark sent'}</button>
          <button class="btn bad sm" data-act="fu" data-id="${f.id}" data-s="skipped">Skip</button></div>`
          : `<div class="meta">${esc(f.status)} by ${esc(f.done_by || '')} ${stamp(f.done_at)}${f.note ? ' · ' + esc(f.note) : ''}</div>`}
      </div>`; };
    return `
      <h2>Follow-ups <small>· ${open.length} to do · written by the Follow-up agent, sent by you</small></h2>
      <p class="small muted">Open WhatsApp starts a chat with the message ready; nothing is sent until you press send in WhatsApp. Then mark it sent. Messages about the customer's own order are fine to send to anyone; reorder invites only appear for customers who ticked "fresh-catch alerts".</p>
      ${open.length ? open.map(card).join('') : '<div class="empty">Nothing waiting. The Follow-up agent checks every morning and midday.</div>'}
      ${done.length ? `<h2>Done in the last 3 days</h2>${done.map(card).join('')}` : ''}`;
  },

  async decide(){
    const [opps, actions, drafts] = await Promise.all([load('opps', () => list('opportunities')), load('actions', () => list('actions')), load('drafts', () => list('drafts'))]);
    const pOpp = opps.filter(o => o.decision === 'pending'), pAct = actions.filter(a => a.status === 'pending_approval'), pDr = drafts.filter(d => d.status === 'draft');
    const blocked = actions.filter(a => a.status === 'blocked');
    const done = [...opps.filter(o => o.decision !== 'pending').map(o => ({t: o.decided_at, txt: `Opportunity “${o.title}” ${o.decision}`, by: o.decided_by})),
                  ...actions.filter(a => ['approved','rejected'].includes(a.status)).map(a => ({t: a.decided_at, txt: `${ACTION[a.action_type] || a.action_type} ${a.status}`, by: a.decided_by})),
                  ...drafts.filter(d => d.status !== 'draft').map(d => ({t: d.approved_at, txt: `Message to ${d.segment} ${d.status}`, by: d.approved_by}))]
                  .sort((a, b) => (b.t || '') > (a.t || '') ? 1 : -1).slice(0, 15);
    return `
      <h2>Opportunities <small>· ${pOpp.length} waiting</small></h2>
      ${pOpp.length ? pOpp.map(o => `<div class="card">
        <div class="row"><h3>${esc(o.title)}</h3><span class="spacer"></span><span class="pill ${o.priority === 'high' ? 'bad' : o.priority === 'medium' ? 'warn' : ''}">${esc(o.priority)}</span></div>
        <div class="meta">${o.agent ? esc(AGENT[o.agent] || o.agent) + ' agent' : 'Added by hand'} · ${stamp(o.created_at)}</div>
        <p><b>Evidence:</b> ${esc(o.evidence)}</p><p><b>Do:</b> ${esc(o.recommended_action)}</p>
        ${o.estimated_impact ? `<p><b>Impact:</b> ${esc(o.estimated_impact)} ${o.impact_is_hypothesis ? '<span class="pill warn">estimate, not proven</span>' : ''}</p>` : ''}
        <div class="acts"><button class="btn sm" data-act="decide" data-kind="opportunity" data-id="${o.id}" data-d="approved">Approve</button>
          <button class="btn ghost sm" data-act="decide" data-kind="opportunity" data-id="${o.id}" data-d="deferred">Later</button>
          <button class="btn bad sm" data-act="decide" data-kind="opportunity" data-id="${o.id}" data-d="rejected">Reject</button></div></div>`).join('')
        : '<div class="empty">No opportunities waiting. The agents add them once they run; you can add your own below.</div>'}
      <details class="more"><summary>Add an opportunity yourself</summary>
        <form data-form="opp"><label>What</label><input name="title" maxlength="160" required placeholder="e.g. Katashingo buyers in Voi">
          <label>Evidence (what the records show)</label><textarea name="evidence" required></textarea>
          <label>What to do</label><textarea name="action" required></textarea>
          <div class="grid2"><div><label>Expected impact</label><input name="impact" placeholder="optional"></div>
          <div><label>Priority</label><select name="priority"><option>high</option><option selected>medium</option><option>low</option></select></div></div>
          <div class="acts"><button class="btn">Add</button></div></form></details>

      <h2>Actions needing your OK <small>· ${pAct.length} waiting</small></h2>
      ${pAct.length ? pAct.map(a => `<div class="card"><div class="row"><h3>${esc(ACTION[a.action_type] || a.action_type)}</h3><span class="spacer"></span><span class="pill warn">needs approval</span></div>
        <div class="meta">${esc(AGENT[a.agent] || a.agent || '')} · ${stamp(a.requested_at)}</div>
        <div class="linkout">${esc(JSON.stringify(a.payload || {}, null, 1))}</div>
        <p class="small muted">Approving records your decision. It does not change prices, send messages or spend money by itself.</p>
        <div class="acts"><button class="btn sm" data-act="decide" data-kind="action" data-id="${a.id}" data-d="approved">Approve</button>
          <button class="btn bad sm" data-act="decide" data-kind="action" data-id="${a.id}" data-d="rejected">Reject</button></div></div>`).join('')
        : '<div class="empty">Nothing waiting. Discounts, price changes, ads, messages and delivery promises from agents land here first.</div>'}

      <h2>Customer message drafts <small>· ${pDr.length} waiting</small></h2>
      ${pDr.length ? pDr.map(d => `<div class="card"><div class="row"><h3>${esc(d.segment)}</h3><span class="spacer"></span><span class="pill">${esc(d.channel)}</span></div>
        <div class="meta">${esc(AGENT[d.agent] || d.agent || '')} · ${stamp(d.created_at)}${d.recipient_count != null ? ' · ' + n0(d.recipient_count) + ' people' : ''}</div>
        <p style="white-space:pre-wrap">${esc(d.body)}</p>
        <p class="small muted">Only customers who agreed to messages can receive it. Nothing is sent from this page.</p>
        <div class="acts"><button class="btn sm" data-act="decide" data-kind="draft" data-id="${d.id}" data-d="approved">Approve</button>
          <button class="btn bad sm" data-act="decide" data-kind="draft" data-id="${d.id}" data-d="rejected">Reject</button></div></div>`).join('')
        : '<div class="empty">No drafts waiting.</div>'}

      ${blocked.length ? `<h2>Blocked attempts <small>· logged</small></h2><div class="tscroll"><table class="tbl"><tr><th>When</th><th>Agent</th><th>Tried to</th><th>Why blocked</th></tr>
        ${blocked.slice(0, 20).map(a => `<tr><td class="mono small">${stamp(a.requested_at)}</td><td>${esc(AGENT[a.agent] || a.agent || '–')}</td><td>${esc(ACTION[a.action_type] || a.action_type)}</td><td class="small">${esc(a.reason || '')}</td></tr>`).join('')}</table></div>` : ''}

      ${done.length ? `<h2>Recent decisions</h2><div class="tscroll"><table class="tbl">${done.map(x => `<tr><td class="mono small">${stamp(x.t)}</td><td>${esc(x.txt)}</td><td class="small muted">${esc(x.by || '')}</td></tr>`).join('')}</table></div>` : ''}`;
  },

  async channels(){
    const ch = await load('chAll', () => view('campaign_conversion_summary', null, null, 2000));
    const months = [...new Set(ch.map(r => r.order_month))].sort().reverse();
    const chans = [...new Set(ch.map(r => r.channel))];
    const cell = (m, c) => ch.filter(r => r.order_month === m && r.channel === c).reduce((s, r) => s + Number(r.orders_through || 0), 0);
    const tot = c => months.reduce((s, m) => s + cell(m, c), 0);
    chans.sort((a, b) => tot(b) - tot(a));
    const tags = ch.filter(r => r.campaign);
    return `
      <h2>Orders by channel and month <small>· paid, not cancelled</small></h2>
      <div class="tscroll"><table class="tbl"><tr><th>Channel</th>${months.map(m => `<th class="n">${esc(monthName(m).replace(/ 20\d\d/, ''))}</th>`).join('')}<th class="n">All</th></tr>
        ${chans.map(c => `<tr><td>${esc(CHANNEL[c] || c)}</td>${months.map(m => `<td class="n">${cell(m, c) || ''}</td>`).join('')}<td class="n"><b>${tot(c)}</b></td></tr>`).join('')}</table></div>
      <div class="note">“Not recorded” are orders from before 24 Aug, when the website started tagging visits. “Website, no tag” came to the site without a tagged link — share the links below to change that.</div>

        ${tags.map(r => `<tr><td class="small">${esc(monthName(r.order_month))}</td><td class="mono">${esc(r.campaign)}</td><td>${esc(CHANNEL[r.channel] || r.channel)}</td><td class="n">${n0(r.orders_through)}</td><td class="n">${n0(r.new_customers)}</td><td class="n">${n0(r.value_kes)}</td></tr>`).join('')}</table></div>` : ''}
      <h2>Tagged links for your profiles</h2>
      ${[['TikTok bio','tiktok','bio'],['Instagram bio','instagram','bio'],['Facebook page','facebook','page'],['YouTube descriptions','youtube','description'],['WhatsApp broadcast','whatsapp','broadcast']].map(([n, s, md]) => {
        const u = `${SITE}/?utm_source=${s}&utm_medium=${md}`;
        return `<div class="card"><div class="row"><b>${n}</b><span class="spacer"></span><button class="btn ghost sm" data-act="copy" data-text="${esc(u)}">Copy</button></div><div class="linkout">${esc(u)}</div></div>`; }).join('')}`;
  },

function addMonths(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
function tagged(c){
  const src = {instagram: 'instagram', facebook: 'facebook', tiktok: 'tiktok', youtube: 'youtube', whatsapp: 'whatsapp', google: 'google'}[c.channel] || c.channel;
  try{ const u = new URL(c.landing_url); u.searchParams.set('utm_source', src); u.searchParams.set('utm_medium', c.budget_kes > 0 ? 'paid' : 'organic'); u.searchParams.set('utm_campaign', c.utm_campaign); return u.toString(); }
  catch(_){ return ''; }
}

/* ---------- social CSV ---------- */
const SOCIAL_COLS = ['platform','post_ref','title','pillar','posted_at','period_start','period_end','views','reach','likes','comments','shares','saves','link_clicks','followers_gained','post_url'];
const ALIAS = {post_id:'post_ref', video_id:'post_ref', post:'post_ref', link:'post_url', url:'post_url', from:'period_start', start:'period_start', to:'period_end', end:'period_end',
  plays:'views', video_views:'views', impressions:'reach', clicks:'link_clicks', website_clicks:'link_clicks', followers:'followers_gained', new_followers:'followers_gained', theme:'pillar', date:'posted_at'};
function parseTable(text){
  const delim = text.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function normDate(s){
  s = String(s || '').trim(); if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);   // day/month/year as used in Kenya
  if(m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return s;
}
function checkCsv(){
  const rows = parseTable($('csvIn').value || '');
  if(rows.length < 2) throw new Error('Paste the header row and at least one post.');
  const head = rows[0].map(h => { const k = h.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); return ALIAS[k] || k; });
  const unknown = head.filter(h => h && !SOCIAL_COLS.includes(h));
  if(!head.includes('platform') || !head.includes('post_ref')) throw new Error('The header row needs at least platform and post_ref.');
  const out = rows.slice(1).map((r, i) => {
    const o = {}; head.forEach((h, j) => { if(SOCIAL_COLS.includes(h)) o[h] = String(r[j] ?? '').trim(); });
    ['views','reach','likes','comments','shares','saves','link_clicks','followers_gained'].forEach(k => { if(o[k] != null) o[k] = o[k].replace(/[,\s]/g, '').replace(/^(\d+(?:\.\d+)?)k$/i, (_, n) => String(Math.round(n * 1000))); });
    ['period_start','period_end','posted_at'].forEach(k => { if(o[k] != null) o[k] = normDate(o[k]); });
    o.platform = (o.platform || '').toLowerCase();
    if(!o.period_start || !o.period_end) throw new Error(`Row ${i + 1}: period_start and period_end are needed.`);
    return o;
  });
  return {rows: out, unknown};
}

/* ---------- clicks and forms ---------- */
$('main').addEventListener('change', e => {
  if(e.target.dataset.change === 'month'){ S.month = e.target.value; render(); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'signout'){ await sb.auth.signOut(); location.reload(); return; }
  if(a === 'decide'){
    const note = b.dataset.d === 'rejected' ? prompt('Why? (optional — saved with the decision)') : null;
    if(note === null && b.dataset.d === 'rejected') return;
    return act(b, () => rpc('growth_decide', {p_kind: b.dataset.kind, p_id: Number(b.dataset.id), p_decision: b.dataset.d, p_note: note || null}),
      {approved: 'Approved', rejected: 'Rejected', deferred: 'Moved to later'}[b.dataset.d]);
  }
  if(a === 'consent-check'){
    const ph = (document.getElementById('cphone') || {}).value || '';
    const info = document.getElementById('consentInfo');
    try{
      const r = await rpc('growth_consent_lookup', {p_phone: ph});
      info.textContent = (r.found ? (r.opted_out_at ? `Said STOP on ${day(r.opted_out_at)}${r.reason ? ' (' + r.reason + ')' : ''}.` : (r.whatsapp ? `Agreed to WhatsApp alerts on ${day(r.since)} (${r.how}).` : 'Recorded, but not agreed to WhatsApp.')) : 'No consent recorded for this number.')
        + ` ${r.orders} paid order${r.orders === 1 ? '' : 's'}.`;
    }catch(err){ info.textContent = err.message; }
    return;
  }
  if(a === 'fu'){
    const s = b.dataset.s;
    const note = s === 'skipped' ? prompt('Why skip? (optional)') : null;
    if(s === 'skipped' && note === null) return;
    return act(b, () => rpc('growth_followup_status', {p_id: Number(b.dataset.id), p_status: s, p_note: note || null}), s === 'skipped' ? 'Skipped' : 'Marked ' + s);
  }
  if(a === 'fu-open'){ return; }   // the link opens WhatsApp; marking sent stays a separate tap
  if(a === 'prospect'){
    const s = b.dataset.s;
    const note = ['rejected','not_interested','contacted','quoted','won'].includes(s) ? prompt('Note (optional) — e.g. who you spoke to, why not') : null;
    if(note === null && ['rejected','not_interested'].includes(s) && !confirm('Mark without a note?')) return;
    return act(b, () => rpc('growth_prospect_status', {p_id: Number(b.dataset.id), p_status: s, p_note: note || null}), 'Saved');
  }
  if(a === 'new-campaign'){ S.editCampaign = 0; render(); return; }
  if(a === 'edit-campaign'){ S.editCampaign = Number(b.dataset.id); render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  if(a === 'cancel-edit'){ S.editCampaign = null; render(); return; }
  if(a === 'camp-status'){
    const s = b.dataset.s;
    if(s === 'Rejected' && !confirm('Reject this campaign?')) return;
    return act(b, () => rpc('growth_set_campaign_status', {p_id: Number(b.dataset.id), p_status: s, p_note: null}), 'Campaign: ' + s);
  }
  if(a === 'camp-note'){
    const n = prompt('What happened? (reach, orders seen, what to repeat)'); if(!n) return;
    const c = (S.cache.camps || []).find(x => x.id === Number(b.dataset.id)) || {};
    return act(b, () => rpc('growth_save_campaign', {p: {id: c.id, name: c.name, results_note: n}}), 'Notes saved');
  }
  if(a === 'void-spend'){
    const r = prompt('Why void this spend? (e.g. entered twice)'); if(!r) return;
    return act(b, () => rpc('growth_void_spend', {p_id: Number(b.dataset.id), p_reason: r}), 'Spend voided');
  }
  if(a === 'copy'){
    const t = b.dataset.text;
    try{ await navigator.clipboard.writeText(t); toast('Link copied'); }catch(_){ prompt('Copy this link:', t); }
    return;
  }
  if(a === 'template'){
    const blob = new Blob([SOCIAL_COLS.join(',') + '\n' + `tiktok,7431234567,Cleaning kingfish,cutting,${todayISO()},${todayISO()},${todayISO()},0,0,0,0,0,0,0,0,\n`], {type: 'text/csv'});
    const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'mombasafish-post-numbers.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
    return;
  }
  if(a === 'csv-check'){
    try{ const r = checkCsv(); S.importRows = r.rows; S.csvText = $('csvIn').value; await render(); $('csvIn').value = S.csvText;
      toast(`${r.rows.length} rows ready${r.unknown.length ? ' · ignored columns: ' + r.unknown.join(', ') : ''}`); }
    catch(err){ S.importRows = null; toast(err.message, 'err'); }
    return;
  }
  if(a === 'csv-import'){
    if(!S.importRows) return;
    b.disabled = true;
    try{ const r = await rpc('growth_import_social', {p_rows: S.importRows}); S.importRows = null; S.csvText = ''; toast(`Imported: ${r.added} new, ${r.updated} updated`); await refresh(); }
    catch(err){ toast(err.message, 'err'); b.disabled = false; }
    return;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const btn = f.querySelector('button:not([type=button])');
  const kind = f.dataset.form;
  if(kind === 'campaign'){
    const p = {}; Object.entries(d).forEach(([k, v]) => { p[k] = String(v).trim() === '' ? null : String(v).trim(); });
    return act(btn, async () => { await rpc('growth_save_campaign', {p: {...p, id: f.dataset.id || null}}); S.editCampaign = null; }, 'Campaign saved');
  }
  if(kind === 'spend'){
    return act(btn, () => rpc('growth_add_spend', {p_platform: d.platform, p_date: d.date, p_amount: num(d.amount), p_campaign: num(d.campaign), p_note: d.note || null}), 'Spend added');
  }
  if(kind === 'consent'){
    const agree = d.what === 'agree';
    if(agree && (d.note || '').trim().length < 3) return toast('Say how they agreed (e.g. asked on WhatsApp 18 Nov).', 'err');
    return act(btn, async () => { await rpc('growth_set_consent', {p_phone: d.phone, p_whatsapp: agree, p_note: d.note || null}); f.reset(); },
      agree ? 'Saved: agreed to alerts' : 'Saved: no more messages to this number');
  }
  if(kind === 'opp'){
    return act(btn, () => rpc('growth_add_opportunity', {p_title: d.title, p_evidence: d.evidence, p_action: d.action, p_impact: d.impact || null, p_priority: d.priority, p_hypothesis: true}), 'Opportunity added');
  }
});

boot();
</script>
