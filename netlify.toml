[build]
  # Static site — nothing to compile. Publish the repo root as-is.
  publish = "."
  command = ""
  # Reserved for the Notion sync function (added in the next step).
  functions = "netlify/functions"

# Never cache the page itself, so order updates appear immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are versioned by filename — cache them hard.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
